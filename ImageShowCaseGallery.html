<html>
<head>
    <title>Image Showcase Gallery</title>
    <link rel="stylesheet" href="Imageshowcasegaller.css">
</head>

<body>

    <h1 id = "h1text">Image Gallery</h1>

    <!-- Main large image -->
    <div class="main-image">
        <img id="largeImage" src="image1.jpg" alt="Selected Image">
    </div>

    <!-- Thumbnails -->
    <div class="thumbnails">
        <img src="image1.jpg" onclick="showImage(this)">

        <img src="image3.jpg" onclick="showImage(this)">
        <img src="image4.jpg" onclick="showImage(this)">
    </div>

    <script src="Imageshowcasegaller.js"></script>

</body>
</html>
